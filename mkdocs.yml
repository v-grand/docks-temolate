site_name: v-grand Platform Docs
repo_url: https://github.com/v-grand/infra-docs

theme:
  name: material
  features:
    - navigation.tabs
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  palette:
    scheme: default
  icon:
    repo: fontawesome/brands/github

nav:
  - 'en':
    - 'Home': 'en/index.md'
  - 'ru':
    - 'Главная': 'ru/index.md'
  - 'pl':
    - 'Strona Główna': 'pl/index.md'

plugins:
  - search
  - i18n:
      default_language: en
      languages:
        en: English
        ru: Русский
        pl: Polski
  - mkdocs-jupyter

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - toc:
      baselevel: 2
